# Local Postgres for development (optional: the backend falls back to SQLite without DATABASE_URL).
#   docker compose up -d
#   DATABASE_URL=postgresql://postgres:postgres@localhost:5433/ariesnews
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ariesnews
    ports:
      - "127.0.0.1:5433:5432" # loopback only; 5433 so it doesn't clash with a locally installed Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ariesnews"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
