# Render Blueprint: one free web service built from the Dockerfile.
# The database is external (e.g. a free Neon Postgres): paste its connection string as DATABASE_URL.
# Render's own Postgres would also work, but it requires a card on file even on the free plan.
services:
  - type: web
    name: newspulse
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GNEWS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-nano
