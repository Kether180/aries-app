# Render Blueprint: one Docker web service + a Postgres database.
services:
  - type: web
    name: newspulse
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: newspulse-db
          property: connectionString
      - key: GNEWS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-nano

databases:
  - name: newspulse-db
    plan: free
